name: 缺陷报告
description: 报告可复现的错误，帮助定位与验证修复。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请先查看已有 Issue 和 README 中的数据规则。不要上传源数据集、私人信息、凭据或真实工作区备份；可提供合成或充分匿名化的最小示例。JSON 工作区备份包含完整数据，也需要同样处理。此表单不要求上传任何私人文件。
  - type: input
    id: version
    attributes:
      label: 应用版本或提交
      description: 例如 Release 版本号、Git 提交 SHA；无法确认时请说明下载来源。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与浏览器
      placeholder: 例如 Windows 11 / Edge 版本号，或 Ubuntu / Chromium 版本号
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，按顺序说明操作；注明使用演示数据、合成 CSV 还是本地工作区。
      placeholder: |
        1. 打开应用……
        2. 导入或选择……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 说明上述操作应得到什么结果。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明实际行为和错误信息；截图或日志请先去除私人数据。
    validations:
      required: true
  - type: textarea
    id: import_settings
    attributes:
      label: CSV 导入信息（如相关）
      description: 说明编码、分隔符、日期格式、逐列类型覆盖、文件大小及行列数。可粘贴合成或匿名化的最小示例，无需提供源文件。
      placeholder: |
        编码：UTF-8 / GB18030
        分隔符：逗号 / 制表符 / 分号 / 竖线
        日期格式：自动或指定格式
        列类型：自动或逐列覆盖
        数据规模与最小示例：
  - type: textarea
    id: workspace
    attributes:
      label: 工作区或备份信息（如相关）
      description: 说明保存、恢复或 .json 导入导出的操作，以及是否使用旧版存档；不要附真实备份。
      placeholder: |
        使用地址（协议、主机、端口，不含私人路径或参数）：
        是否更换浏览器、端口、主机名或使用隐私窗口：
        工作区保存 / 恢复 / 备份步骤及错误信息：
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供复现频率、已尝试的排查、相关 Issue 或经过脱敏的诊断信息。
