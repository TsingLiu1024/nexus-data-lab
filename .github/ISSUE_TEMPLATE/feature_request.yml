name: 功能建议
description: 描述遇到的问题与希望获得的结果。
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        请先查看已有 Issue 和 README。说明使用场景即可，不要附源数据集、私人信息、凭据或真实工作区备份；需要示例时使用合成或充分匿名化的数据。建议应符合数据在用户设备内处理的约定。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 在什么场景下遇到什么困难？当前流程有什么具体限制？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的结果
      description: 描述希望用户如何完成任务，以及如何判断这个建议解决了问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 实现建议或替代方案
      description: 如有想法，可描述交互、规则、现有替代做法及其不足。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可提供相关 Issue、合成示例或不含私人信息的草图。
